<!-- cdkScrollable: Material menus and tooltips follow this element's scrolling, as the document never scrolls. -->
<main class="content" cdkScrollable appScrollRestoration>
  <router-outlet />
</main>

@if ($user()) {
  <nav class="bottom-nav" [attr.aria-label]="translate('app.nav.label')" data-testid="bottom-nav">
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        [class.active]="item.$active()"
        [attr.aria-current]="item.$active() ? 'page' : null">
        <span class="indicator">
          <mat-icon class="outlined" [svgIcon]="item.icon" aria-hidden="true" />
          <mat-icon class="filled" [svgIcon]="item.activeIcon" aria-hidden="true" />
        </span>
        <span class="label">{{ translate(item.label) }}</span>
      </a>
    }
  </nav>
}
