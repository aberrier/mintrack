<section class="enter mx-auto flex max-w-sm flex-col gap-6 px-4 pt-16 pb-8">
  <img src="icons/icon.svg" alt="" width="64" height="64" class="size-16 rounded-2xl" />
  <h1 class="[font:var(--mat-sys-headline-small)] font-semibold!">{{ translate('app.login.title') }}</h1>
  <form class="flex flex-col gap-2" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>{{ translate('app.login.username') }}</mat-label>
      <input
        matInput
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ translate('app.login.password') }}</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" required />
    </mat-form-field>
    @if ($error(); as error) {
      <p role="alert" class="text-error">{{ translate(error) }}</p>
    }
    <button matButton="filled" type="submit" class="min-h-12" [disabled]="$busy()">
      {{ translate('app.login.title') }}
    </button>
  </form>
</section>
