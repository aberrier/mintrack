<div class="flex flex-col gap-2" data-testid="push-settings">
  @let hint = $hint();
  <mat-slide-toggle
    class="min-h-12"
    [checked]="store.$state() === 'on'"
    [disabled]="!$canToggle()"
    [aria-describedby]="hint ? 'push-hint' : ''"
    (change)="toggle($event)">
    {{ translate('app.push.toggle') }}
  </mat-slide-toggle>
  @if (hint) {
    <p id="push-hint" class="text-on-surface-variant [font:var(--mat-sys-body-medium)]" data-testid="push-hint">
      {{ translate(hint) }}
    </p>
  } @else if (store.$state() === 'on') {
    <button
      matButton="outlined"
      type="button"
      class="min-h-12 self-start"
      [disabled]="store.$busy()"
      (click)="store.sendTest()">
      {{ translate('app.push.test.button') }}
    </button>
  }
</div>
