<div class="flex flex-col gap-2" data-testid="push-settings">
  <div class="flex min-h-12 items-center gap-4">
    <div class="flex min-w-0 grow flex-col">
      <span id="push-label" class="[font:var(--mat-sys-title-medium)]">{{ translate('app.push.toggle') }}</span>
      <span
        id="push-status"
        class="text-on-surface-variant [font:var(--mat-sys-body-medium)]"
        data-testid="push-status">
        {{ translate($status()) }}
      </span>
    </div>
    <mat-slide-toggle
      aria-labelledby="push-label"
      aria-describedby="push-status"
      [checked]="store.$state() === 'on'"
      [disabled]="!$canToggle()"
      (change)="toggle($event)" />
  </div>
  @if (store.$state() === 'on') {
    <button
      matButton="outlined"
      type="button"
      class="min-h-12 self-start"
      [disabled]="store.$busy()"
      (click)="store.sendTest()">
      {{ translate('app.push.test.button') }}
    </button>
  }
  <a matButton class="-ms-3 min-h-12 self-start" [routerLink]="appRoutes.pushHelp()">
    {{ translate('app.push.howTo') }}
  </a>
</div>
