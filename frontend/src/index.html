<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MinTrack</title>
    <base href="/" />
    <!-- viewport-fit=cover: draw under the notch and the gesture bar, the shell pads with env(safe-area-inset-*).
         resizes-content: the on-screen keyboard shrinks the layout instead of covering it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318" />
    <meta name="description" content="Track your shows and movies." />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
