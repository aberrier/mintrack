<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MinTrack</title>
    <base href="/" />
    <!-- viewport-fit=cover: draw under the notch and the gesture bar, the shell pads with env(safe-area-inset-*).
         resizes-content: in Chromium, the on-screen keyboard shrinks the layout instead of covering it; Safari ignores
         it and scrolls the focused field above the keyboard. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- The app opened from the iPhone Home Screen: named MinTrack, its content below the status bar rather than behind
         it (black-translucent draws the status bar's white text over the content, unreadable on the light theme). -->
    <meta name="apple-mobile-web-app-title" content="MinTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141a" />
    <meta name="description" content="Track your shows and movies." />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- The titles' font, used by the first screen: fetched alongside the styles rather than once they are parsed. -->
    <link rel="preload" href="fonts/outfit-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
