name: Bug
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, do not open an issue; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of Profile › Settings, or the image tag in docker-compose.yml.
      placeholder: 1.4.2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The steps to get there, and the device and browser when it is about the app.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The output of `docker compose logs --tail 200 migrate server worker` around the problem. Remove anything
        private first (addresses, names).
      render: text
