name: Release

# Publishes X.Y.Z for every vX.Y.Z tag of a commit on master, X.Y when it is the highest of its line, and latest
# when it is the highest of all: a patch to an older line moves neither. Then creates the GitHub release of the tag.
# `just release X.Y.Z` sets the versions the tag must match.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Every tag and master, to compare versions and check where the tagged commit is.
          fetch-depth: 0
      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version='(0|[1-9][0-9]*)'
          pattern="^v$version\.$version\.$version\$"
          # A release candidate vX.Y.Z-rc.N publishes only its own image tag, from any branch, as a pre-release.
          candidate="^v$version\.$version\.$version-rc\.([1-9][0-9]*)\$"
          if [[ "$TAG" =~ $candidate ]]; then
            major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}" rc="${BASH_REMATCH[4]}"
            python_version="$major.$minor.${patch}rc$rc" npm_version="$major.$minor.$patch-rc.$rc"
          elif [[ "$TAG" =~ $pattern ]]; then
            major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}" rc=""
            python_version="$major.$minor.$patch" npm_version="$major.$minor.$patch"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$TAG is not on master"
              exit 1
            fi
          else
            echo "::error::$TAG is not a vX.Y.Z or vX.Y.Z-rc.N tag without leading zeros"
            exit 1
          fi
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          frontend=$(jq -r .version frontend/package.json)
          if [[ "$project" != "$python_version" || "$frontend" != "$npm_version" ]]; then
            echo "::error::$TAG does not match pyproject.toml ($project) and frontend/package.json ($frontend)"
            exit 1
          fi
          highest() { git tag --list "$1" | grep -E "$pattern" | sort -V | tail -n 1; }
          image=ghcr.io/aberrier/mintrack
          list="$image:${TAG#v}"
          if [[ -z "$rc" ]]; then
            if [[ "$(highest "v$major.$minor.*")" == "$TAG" ]]; then list+=",$image:$major.$minor"; fi
            if [[ "$(highest 'v*')" == "$TAG" ]]; then list+=",$image:latest"; fi
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: COMMIT=${{ steps.tags.outputs.commit }}
          provenance: mode=max
          sbom: true

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The generated notes follow these lines.
          notes="Image: \`docker pull ghcr.io/aberrier/mintrack:${TAG#v}\`"
          prerelease=()
          if [[ "$TAG" == *-rc.* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --generate-notes --notes "$notes" "${prerelease[@]}"
