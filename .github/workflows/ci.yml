name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mintrack
          POSTGRES_PASSWORD: "p@ss/w:rd%#?ci"
          POSTGRES_DB: mintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINTRACK__DATABASE__HOST: localhost
      MINTRACK__DATABASE__USER: mintrack
      MINTRACK__DATABASE__PASSWORD: "p@ss/w:rd%#?ci"
      MINTRACK__DATABASE__NAME: mintrack
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: Lint and type check
        run: uvx --from rust-just just check
      - name: Test
        run: uvx --from rust-just just test
      - name: Audit workflows
        run: uvx zizmor==1.32.0 --offline --config .github/zizmor.yml .github/workflows

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Format and type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build (fails over the bundle budgets)
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Build the image
        run: uvx --from rust-just just image
      - name: Start the fake TMDB
        # On the host, reached by the server container through the compose network's gateway.
        run: |
          uv sync --locked
          nohup uv run uvicorn tests.fakes.tmdb:app --host 0.0.0.0 --port 8001 > fake-tmdb.log 2>&1 &
      - name: Start MinTrack with docker compose
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)p@ss/w:rd%#"
            echo "MINTRACK__SECURITY__SECRET_KEY=$(openssl rand -hex 32)"
            echo "MINTRACK__PROJECT__PUBLIC_URL=http://localhost:8000"
            echo "MINTRACK__TMDB__API_KEY=e2e-key"
            echo "MINTRACK__TMDB__URL=http://172.30.0.1:8001/3"
          } > .env
          docker compose up --detach --wait --wait-timeout 120
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Playwright
        working-directory: frontend
        # The tests run headless, which uses only the headless shell.
        run: npm ci && npx playwright install --with-deps --only-shell chromium
      - name: Browser tests
        working-directory: frontend
        env:
          MINTRACK_E2E_BASE_URL: http://localhost:8000
        run: npx playwright test
      - name: Logs
        if: failure()
        run: docker compose logs && cat fake-tmdb.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
