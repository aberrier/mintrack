name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mintrack
          POSTGRES_PASSWORD: "p@ss/w:rd%#?ci"
          POSTGRES_DB: mintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINTRACK__DATABASE__HOST: localhost
      MINTRACK__DATABASE__USER: mintrack
      MINTRACK__DATABASE__PASSWORD: "p@ss/w:rd%#?ci"
      MINTRACK__DATABASE__NAME: mintrack
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: Lint and type check
        run: uvx --from rust-just just check
      - name: Test
        run: uvx --from rust-just just test
      - name: Audit workflows
        run: uvx zizmor==1.32.0 --offline --config .github/zizmor.yml .github/workflows

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Format and type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build (fails over the bundle budgets)
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mintrack
          POSTGRES_PASSWORD: mintrack
          POSTGRES_DB: mintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINTRACK__DATABASE__HOST: localhost
      MINTRACK__DATABASE__USER: mintrack
      MINTRACK__DATABASE__PASSWORD: mintrack
      MINTRACK__DATABASE__NAME: mintrack
      MINTRACK_E2E_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the app
        working-directory: frontend
        run: npm ci && npm run build
      - name: Start MinTrack
        run: |
          uv sync --locked --no-dev
          MINTRACK__SERVER__FRONTEND_DIST="$PWD/frontend/dist/frontend/browser" uv run --no-sync mintrack server > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/api/health && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Server log
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
