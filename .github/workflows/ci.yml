name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mintrack
          POSTGRES_PASSWORD: "p@ss/w:rd%#?ci"
          POSTGRES_DB: mintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINTRACK__DATABASE__HOST: localhost
      MINTRACK__DATABASE__USER: mintrack
      MINTRACK__DATABASE__PASSWORD: "p@ss/w:rd%#?ci"
      MINTRACK__DATABASE__NAME: mintrack
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
      - name: Install
        run: uv sync --locked
      - name: Lint and type check
        run: uvx --from rust-just==1.59.0 just check
      - name: Test
        # Fails when line and branch coverage falls under 94%.
        run: uvx --from rust-just==1.59.0 just test --cov-branch --cov-fail-under=94
      - name: Audit workflows
        run: uvx zizmor==1.32.0 --offline --config .github/zizmor.yml .github/workflows

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Format and type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build (fails over the bundle budgets)
        run: npm run build

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The browser tests take most of the time: split over three runners for Chromium (Android phone and desktop) and
    # two for WebKit (iPhone), which runs half as many tests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, projects: phone desktop, shard: 1, shards: 3 }
          - { browser: chromium, projects: phone desktop, shard: 2, shards: 3 }
          - { browser: chromium, projects: phone desktop, shard: 3, shards: 3 }
          - { browser: webkit, projects: iphone, shard: 1, shards: 2 }
          - { browser: webkit, projects: iphone, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        # As `just image`, with the layers cached in GitHub Actions' cache. Loaded on the runner, never pushed.
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/aberrier/mintrack:edge
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
      - name: Start the fake TMDB and TVmaze
        # On the host, reached by the containers through the compose network's gateway.
        run: |
          uv sync --locked
          nohup uv run uvicorn tests.fakes.tmdb:app --host 0.0.0.0 --port 8001 > fake-tmdb.log 2>&1 &
          nohup uv run uvicorn tests.fakes.tvmaze:app --host 0.0.0.0 --port 8002 > fake-tvmaze.log 2>&1 &
      - name: Start MinTrack with docker compose
        run: |
          # The values an installer edits, set in an override Compose merges into docker-compose.yml.
          cat > docker-compose.override.yml << EOF
          x-environment: &environment
            MINTRACK__SECURITY__SECRET_KEY: "$(openssl rand -hex 32)"
            MINTRACK__TMDB__API_KEY: e2e-key
            MINTRACK__TMDB__URL: http://172.30.0.1:8001/3
            MINTRACK__TVMAZE__URL: http://172.30.0.1:8002
            MINTRACK__DATABASE__PASSWORD: &password "$(openssl rand -hex 16)p@ss/w:rd%#"
          services:
            db:
              environment:
                POSTGRES_PASSWORD: *password
            migrate: { image: "ghcr.io/aberrier/mintrack:edge", environment: *environment }
            server: { image: "ghcr.io/aberrier/mintrack:edge", environment: *environment }
            worker: { image: "ghcr.io/aberrier/mintrack:edge", environment: *environment }
          EOF
          docker compose up --detach
          # The worker has no healthcheck, which --wait refuses: wait for the server (and its db and migrate) only.
          docker compose up --detach --wait --wait-timeout 120 server
      # The image built above is only loaded on this runner, never published: the caches cannot poison a release.
      - uses: actions/setup-node@v7 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v6 # zizmor: ignore[cache-poisoning]
        if: matrix.browser == 'chromium'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright
        working-directory: frontend
        env:
          BROWSER: ${{ matrix.browser }}
        # A cached browser is not downloaded again. Chromium runs headless, which uses only the headless shell, and
        # the runner image already has its libraries (apt mirrors can take minutes). WebKit's libraries are not on
        # the runner: it runs from Playwright's own image, as a browser server on the host network.
        run: |
          npm ci
          if [[ $BROWSER == webkit ]]; then
            version=$(npx playwright --version | awk '{print $2}')
            docker run --detach --rm --network host --ipc host --init --user pwuser \
              "mcr.microsoft.com/playwright:v$version-noble" \
              npx -y "playwright@$version" run-server --port 3765 --host 127.0.0.1
            timeout 180 bash -c 'until curl -s -o /dev/null http://127.0.0.1:3765/; do sleep 1; done'
          else
            npx playwright install --only-shell chromium
          fi
      - name: Browser tests
        working-directory: frontend
        env:
          MINTRACK_E2E_BASE_URL: http://localhost:8000
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          BROWSER: ${{ matrix.browser }}
        run: |
          if [[ $BROWSER == webkit ]]; then export PW_TEST_CONNECT_WS_ENDPOINT=ws://127.0.0.1:3765/; fi
          read -ra names <<< "$PROJECTS"
          npx playwright test "${names[@]/#/--project=}" --shard="$SHARD"
      - name: Logs
        if: failure()
        run: docker compose logs && cat fake-tmdb.log fake-tvmaze.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7
