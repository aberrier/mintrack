version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Waits a week before proposing a newly published release.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node major the app runs on (CI and the Dockerfile).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The TypeScript version is bounded by @angular/compiler-cli's peer dependency (one minor at a time): moved by
      # hand with Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Only LTS Node majors (even numbers); moved by hand, with CI's node-version and @types/node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
